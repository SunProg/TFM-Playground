  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: 16px !important;
  height: 16px !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

      consistent_2:{joint:[0.46544,0.29366,0.29823,0.11699,0.06256,0.04815,0.03793,0.03451,0.03415],mode:[0.83472,0.51419,0.46876,0.10829,0.00689,0.00015,0,0,0]},
      consistent_3:{joint:[0.46564,0.29371,0.11168,0.03949,0.02429,0.02006,0.01809,0.01755,0.01721],mode:[0.83454,0.51352,0.16019,0.02359,0.00066,0.00001,0,0,0]},
      contradictory:{joint:[0.46593,0.39264,0.28587,0.11986,0.05888,0.03924,0.35231,0.16655,0.16146],mode:[0.83454,0.66002,0.4287,0.10152,0.00502,0.00003,0.18864,0.00002,0]},
      noisy:{joint:[0.46558,0.39855,0.29197,0.3051,0.25588,0.21462,0.19051,0.18137,0.17501],mode:[0.83487,0.66979,0.43622,0.41952,0.27954,0.14456,0.07404,0.03693,0.01793]}
    }
  };
  const visibility = {vanilla: true, k2: true, k4: true, adaptive: true, k16: true, exact: true};
  const tooltip = root.querySelector(&quot;.tooltip&quot;);

  function drawChart(containerId, series, yLabel, domain) {
    const container = document.getElementById(containerId);
    container.replaceChildren();
    const width = Math.max(320, container.getBoundingClientRect().width || 736);
    const height = width &lt; 430 ? 270 : 300;
    const margin = {top: 12, right: 22, bottom: 58, left: 68};
    const innerWidth = width - margin.left - margin.right;
    const innerHeight = height - margin.top - margin.bottom;
    const svg = d3.select(container).append(&quot;svg&quot;)
      .attr(&quot;class&quot;, &quot;chart-svg&quot;)
      .attr(&quot;viewBox&quot;, `0 0 ${width} ${height}`)
      .attr(&quot;role&quot;, &quot;img&quot;)
      .attr(&quot;aria-label&quot;, `${yLabel} by number of arriving labelled samples`);
    svg.append(&quot;title&quot;).text(`${yLabel} by added sample size`);
    const g = svg.append(&quot;g&quot;).attr(&quot;transform&quot;, `translate(${margin.left},${margin.top})`);
    const x = d3.scalePoint().domain(milestones).range([8, innerWidth - 8]);
    const y = d3.scaleLinear().domain(domain).nice().range([innerHeight, 0]);
    const tickValues = width &lt; 430 ? [0, 4, 32, 128] : milestones;
    g.append(&quot;g&quot;).attr(&quot;class&quot;, &quot;chart-grid&quot;)
      .call(d3.axisLeft(y).ticks(5).tickSize(-innerWidth).tickFormat(&quot;&quot;));
    g.append(&quot;rect&quot;).attr(&quot;class&quot;, &quot;chart-frame&quot;).attr(&quot;data-chart-frame&quot;, &quot;&quot;)
      .attr(&quot;width&quot;, innerWidth).attr(&quot;height&quot;, innerHeight).attr(&quot;fill&quot;, &quot;none&quot;);
    g.append(&quot;g&quot;).attr(&quot;transform&quot;, `translate(0,${innerHeight})`)
      .call(d3.axisBottom(x).tickValues(tickValues));
    g.append(&quot;g&quot;).call(d3.axisLeft(y).ticks(5).tickFormat(d3.format(&quot;.1f&quot;)));
    g.append(&quot;text&quot;).attr(&quot;class&quot;, &quot;axis-title&quot;).attr(&quot;data-axis&quot;, &quot;x&quot;)
      .attr(&quot;x&quot;, innerWidth / 2).attr(&quot;y&quot;, innerHeight + 46).attr(&quot;text-anchor&quot;, &quot;middle&quot;)
      .text(&quot;Arriving labelled samples (log-spaced milestones)&quot;);
    g.append(&quot;text&quot;).attr(&quot;class&quot;, &quot;axis-title&quot;).attr(&quot;data-axis&quot;, &quot;y&quot;)
      .attr(&quot;transform&quot;, &quot;rotate(-90)&quot;).attr(&quot;x&quot;, -innerHeight / 2).attr(&quot;y&quot;, -50)
      .attr(&quot;text-anchor&quot;, &quot;middle&quot;).text(yLabel);
    const line = d3.line().x(d =&gt; x(d.x)).y(d =&gt; y(d.y));
    series.filter(s =&gt; s.visible).forEach(s =&gt; {
      const values = milestones.map((m, i) =&gt; ({x:m, y:s.values[i]}));
      g.append(&quot;path&quot;).datum(values).attr(&quot;class&quot;, `series-line ${s.className}`).attr(&quot;d&quot;, line);
      g.selectAll(`circle.${s.key}`).data(values).enter().append(&quot;circle&quot;)
        .attr(&quot;class&quot;, `series-point ${s.className} ${s.key}`).attr(&quot;cx&quot;, d =&gt; x(d.x))
        .attr(&quot;cy&quot;, d =&gt; y(d.y)).attr(&quot;r&quot;, 3.8);
    });
    const guide = g.append(&quot;line&quot;).attr(&quot;class&quot;, &quot;hover-guide&quot;).attr(&quot;y1&quot;, 0).attr(&quot;y2&quot;, innerHeight).attr(&quot;visibility&quot;, &quot;hidden&quot;);
    const markerLayer = g.append(&quot;g&quot;);
    g.append(&quot;rect&quot;).attr(&quot;data-chart-hit&quot;, &quot;&quot;).attr(&quot;data-chart-hover-overlay&quot;, &quot;cross-series&quot;)
      .attr(&quot;width&quot;, innerWidth).attr(&quot;height&quot;, innerHeight).attr(&quot;fill&quot;, &quot;transparent&quot;)
      .on(&quot;mousemove&quot;, event =&gt; {
        const [mx] = d3.pointer(event);
        const nearest = milestones.reduce((a,b) =&gt; Math.abs(x(a)-mx) &lt; Math.abs(x(b)-mx) ? a : b);
        guide.attr(&quot;x1&quot;, x(nearest)).attr(&quot;x2&quot;, x(nearest)).attr(&quot;visibility&quot;, &quot;visible&quot;);
        markerLayer.selectAll(&quot;*&quot;).remove();
        const active = series.filter(s =&gt; s.visible);
        active.forEach(s =&gt; {
          const value = s.values[milestones.indexOf(nearest)];
          markerLayer.append(&quot;circle&quot;).attr(&quot;class&quot;, `hover-marker ${s.className}`)
            .attr(&quot;cx&quot;, x(nearest)).attr(&quot;cy&quot;, y(value)).attr(&quot;r&quot;, 5);
        });
        tooltip.hidden = false;
        tooltip.innerHTML = `&lt;strong&gt;${nearest} added samples&lt;/strong&gt;&lt;br&gt;${active.map(s =&gt; `${s.label}: ${s.values[milestones.indexOf(nearest)].toFixed(3)}`).join(&quot;&lt;br&gt;&quot;)}`;
        const bounds = root.getBoundingClientRect();
        tooltip.style.left = `${Math.min(event.clientX - bounds.left + 12, bounds.width - 190)}px`;
        tooltip.style.top = `${event.clientY - bounds.top + 12}px`;
      })
      .on(&quot;mouseleave&quot;, () =&gt; { guide.attr(&quot;visibility&quot;, &quot;hidden&quot;); markerLayer.selectAll(&quot;*&quot;).remove(); tooltip.hidden = true; });
  }

  function render() {
    const selected = document.getElementById(&quot;ambiguity-condition&quot;).value;
    const d = data[selected];
    const b = exact[selected];
    const k2 = earlier.k2[selected];
    const k4 = earlier.k4[selected];
    const k16 = earlier.k16[selected];
    const entropyCeiling = Math.min(1, d3.max([...d.vanilla, ...k2.joint, ...k4.joint, ...d.adaptive, ...k16.joint, ...b.joint]) + 0.06);
    drawChart(&quot;predictive-entropy-chart&quot;, [
      {key:&quot;vanilla&quot;,label:&quot;Vanilla&quot;,values:d.vanilla,className:&quot;vanilla-series&quot;,visible:visibility.vanilla},
      {key:&quot;k2&quot;,label:&quot;Adaptive K=2&quot;,values:k2.joint,className:&quot;k2-series&quot;,visible:visibility.k2},
      {key:&quot;k4&quot;,label:&quot;Adaptive K=4&quot;,values:k4.joint,className:&quot;k4-series&quot;,visible:visibility.k4},
      {key:&quot;adaptive&quot;,label:&quot;Adaptive K=8&quot;,values:d.adaptive,className:&quot;adaptive-series&quot;,visible:visibility.adaptive},
      {key:&quot;k16&quot;,label:&quot;Adaptive K=16&quot;,values:k16.joint,className:&quot;k16-series&quot;,visible:visibility.k16},
      {key:&quot;exact&quot;,label:&quot;Exact Bayes&quot;,values:b.joint,className:&quot;exact-series&quot;,visible:visibility.exact}
    ], &quot;Normalized joint entropy&quot;, [0, entropyCeiling]);
    drawChart(&quot;mode-entropy-chart&quot;, [
      {key:&quot;k2&quot;,label:&quot;Adaptive K=2 mode ambiguity&quot;,values:k2.mode,className:&quot;k2-series&quot;,visible:visibility.k2},
      {key:&quot;k4&quot;,label:&quot;Adaptive K=4 mode ambiguity&quot;,values:k4.mode,className:&quot;k4-series&quot;,visible:visibility.k4},
      {key:&quot;ambiguity&quot;,label:&quot;Adaptive K=8 mode ambiguity&quot;,values:d.ambiguity,className:&quot;adaptive-series&quot;,visible:visibility.adaptive},
      {key:&quot;k16&quot;,label:&quot;Adaptive K=16 mode ambiguity&quot;,values:k16.mode,className:&quot;k16-series&quot;,visible:visibility.k16},
      {key:&quot;exact&quot;,label:&quot;Exact Bayes mode ambiguity&quot;,values:b.mode,className:&quot;exact-series&quot;,visible:visibility.exact}
    ], &quot;Normalized mode entropy&quot;, [0, 1]);
  }

  document.getElementById(&quot;ambiguity-condition&quot;).addEventListener(&quot;change&quot;, render);
  root.querySelectorAll(&quot;[data-series]&quot;).forEach(button =&gt; button.addEventListener(&quot;click&quot;, () =&gt; {
    const key = button.dataset.series;
    visibility[key] = !visibility[key];
    button.setAttribute(&quot;aria-pressed&quot;, String(visibility[key]));
    render();
  }));
  new ResizeObserver(render).observe(root);
  render();
})();

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
