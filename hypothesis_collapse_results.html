<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hypothesis Collapse Results</title>
  <style>
    :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: light-dark(#fff, #181818); color: light-dark(#1a1c1f, #fff); }
    nav { position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; gap: 8px 22px; padding: 12px 16px; border-bottom: 1px solid light-dark(#e6e6e6, #383838); background: light-dark(#fff, #181818); }
    button { display: inline-flex; align-items: center; gap: 8px; padding: 3px 0; border: 0; background: transparent; color: inherit; font: inherit; cursor: pointer; }
    button::before { content: ""; width: 18px; height: 3px; background: light-dark(#888, #aaa); }
    button[aria-pressed="true"] { font-weight: 650; }
    button[aria-pressed="true"]::before { background: light-dark(#339cff, #83c3ff); }
    main { width: 100%; }
    iframe { display: none; width: 100%; height: calc(100vh - 55px); border: 0; }
    iframe.active { display: block; }
  </style>
</head>
<body>
  <nav aria-label="Result views">
    <button type="button" data-view="all-models" aria-pressed="true">All-model comparison</button>
    <button type="button" data-view="js" aria-pressed="false">Shared-JS validation</button>
    <button type="button" data-view="bimodal" aria-pressed="false">Bimodal situation</button>
  </nav>
  <main>
    <iframe id="all-models" class="active" title="All-model comparison" src="hypothesis_collapse_all_models.html"></iframe>
    <iframe id="js" title="Shared-JS validation" src="hypothesis_collapse_js_results.html"></iframe>
    <iframe id="bimodal" title="Bimodal situation" src="hypothesis_collapse_bimodal_results.html"></iframe>
  </main>
  <script>
    const buttons = document.querySelectorAll("[data-view]");
    const frames = document.querySelectorAll("iframe");
    buttons.forEach(button => button.addEventListener("click", () => {
      buttons.forEach(item => item.setAttribute("aria-pressed", String(item === button)));
      frames.forEach(frame => frame.classList.toggle("active", frame.id === button.dataset.view));
    }));
  </script>
</body>
</html>
